name: Auto Update FortiGate Blocklist

on:
  schedule:
    - cron: '0 0 * * *' # Tự động chạy vào 00:00 UTC mỗi ngày
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công bất kỳ lúc nào

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and filter domain list
        run: |
          # Tải file hosts Unified từ StevenBlack
          curl -sSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o hosts.raw
          
          # Lọc chỉ lấy dòng chứa IP, lấy cột tên miền, loại bỏ localhost và sắp xếp
          grep -E '^(0\.0\.0\.0|127\.0\.0\.1)' hosts.raw | awk '{print $2}' | grep -v '^localhost' | sort -u > adblock.txt
          
          # Dọn dẹp file tạm
          rm hosts.raw

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add adblock.txt
          git commit -m "Auto-update domain blocklist [skip ci]" || exit 0
          git push
